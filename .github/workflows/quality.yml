name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore UsbForensicAudit.sln --locked-mode

      - name: Verify code formatting
        run: dotnet format UsbForensicAudit.sln --verify-no-changes --no-restore

      - name: Build with warnings as errors
        run: dotnet build UsbForensicAudit.sln -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/UsbForensicAudit.Tests/UsbForensicAudit.Tests.csproj
          -c Release --no-build --no-restore
          --collect:"XPlat Code Coverage"
          --settings tests/UsbForensicAudit.Tests/coverlet.runsettings
          --results-directory TestResults

      - name: Enforce 90 percent line coverage
        shell: pwsh
        run: |
          $report = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $report) { throw "Coverage report was not produced." }
          [xml]$coverage = Get-Content $report.FullName
          $lineRate = [double]::Parse(
            $coverage.coverage.'line-rate',
            [Globalization.CultureInfo]::InvariantCulture)
          Write-Host ("Line coverage: {0:P2}" -f $lineRate)
          $classes = $coverage.SelectNodes("//class") | ForEach-Object {
            [pscustomobject]@{
              Name = $_.name
              Rate = [double]::Parse($_.'line-rate', [Globalization.CultureInfo]::InvariantCulture)
              Lines = $_.SelectNodes("lines/line").Count
            }
          } | Sort-Object Rate
          Write-Host "=== Coverage by class (worst first) ==="
          $classes | Where-Object { $_.Rate -lt 0.9 } | ForEach-Object {
            Write-Host ("{0:P1}  lines={1}  {2}" -f $_.Rate, $_.Lines, $_.Name)
          }
          if ($lineRate -lt 0.90) { throw "Line coverage is below 90%." }


      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Reject vulnerable dependencies
        shell: pwsh
        run: |
          $audit = dotnet list UsbForensicAudit.sln package --vulnerable --include-transitive 2>&1
          $audit | Write-Host
          if ($audit -match "following vulnerable packages") {
            throw "Vulnerable NuGet dependencies detected."
          }

      - name: Publish portable application
        shell: pwsh
        run: >
          ./scripts/publish-app.ps1
          -PublishDir artifacts/publish
          -SkipRunningProcessCheck
          -GenerateEngineeringGuideIfMissing

      - uses: actions/upload-artifact@v7
        with:
          name: UsbForensicAudit-win-x64
          path: artifacts/publish
          if-no-files-found: error
